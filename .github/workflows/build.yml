name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Pamięć podręczna biblioteki symboli
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/symbols
          key: symbols-${{ hashFiles('tools/fetch_symbols.py') }}

      - name: Odtwórz keystore (jeśli ustawiony w Secrets)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Budowanie
        run: gradle assembleRelease --stacktrace

      - name: Sprawdź, czy biblioteka symboli jest w APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          N=$(unzip -l "$APK" | grep -c 'assets/symbols/[mo]/' || true)
          echo "Symboli w APK: $N"
          ls -la "$APK"
          test "$N" -gt 5000

      - uses: actions/upload-artifact@v4
        with:
          name: gwarek-apk
          path: app/build/outputs/apk/release/*.apk
